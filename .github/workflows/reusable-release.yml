name: Reusable Release Build

on:
  workflow_call:
    inputs:
      archive_suffix:
        type: string
        default: ""
      pages_commit_message:
        type: string
        required: true
      rolling_tag:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_body:
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false
      make_latest:
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [android, windows, linux, web, macos]
        include:
          - target: android
            os: ubuntu-latest
            artifact_name: apk
          - target: windows
            os: windows-latest
            artifact_name: windows
          - target: linux
            os: ubuntu-latest
            artifact_name: linux
          - target: web
            os: ubuntu-latest
            artifact_name: web
          - target: macos
            os: macos-26
            artifact_name: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Read version
        shell: bash
        run: |
          echo "STASHFLOW_VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Android build setup
        if: matrix.target == 'android'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Linux build setup
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libmpv-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libarchive-tools \
            fakeroot

      - name: Generate macOS Flutter ephemeral files
        if: matrix.target == 'macos'
        run: flutter build macos --config-only

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            flutter build apk --release --split-per-abi
          elif [ "${{ matrix.target }}" = "windows" ]; then
            flutter build windows --release
          elif [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release
          elif [ "${{ matrix.target }}" = "web" ]; then
            flutter build web --release --base-href /StashFlow/
          elif [ "${{ matrix.target }}" = "macos" ]; then
            flutter build macos --release
          fi
        shell: bash

      - name: Package Windows
        if: matrix.target == 'windows'
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../../../StashFlow-${STASHFLOW_VERSION}-windows-x64.zip *
        shell: bash

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../StashFlow-${STASHFLOW_VERSION}-linux-x64.zip .
        shell: bash

      - name: Package Web
        if: matrix.target == 'web'
        run: |
          cd build/web
          zip -r ../../StashFlow-${STASHFLOW_VERSION}-web.zip .
        shell: bash

      - name: Deploy to GitHub Pages
        if: matrix.target == 'web'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: ${{ inputs.pages_commit_message }}

      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../StashFlow-${STASHFLOW_VERSION}-macos-$(uname -m).zip *.app
        shell: bash

      - name: Name Android binaries
        if: matrix.target == 'android'
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#*app-}"
            abi="${abi%-release.apk}"
            mv "$apk" "build/app/outputs/flutter-apk/StashFlow-${STASHFLOW_VERSION}-android-${abi}.apk"
          done
        shell: bash

      - name: Package Linux dists
        if: matrix.target == 'linux'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          sudo wget -qO /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          dart pub global activate fastforge 0.6.12
          fastforge package --platform linux --targets deb,appimage,pacman --artifact-name 'StashFlow-{{build_name}}{{#has_build_number}}+{{build_number}}{{/has_build_number}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.pacman' -o -name '*.pkg.tar.zst' \) -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              *.pkg.tar.zst) extension=pkg.tar.zst ;;
              *) extension="${file##*.}" ;;
            esac
            mv "$file" "$(dirname "$file")/StashFlow-${STASHFLOW_VERSION}-linux-x64.${extension}"
          done
        shell: bash

      - name: Package Windows dists
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:PATH += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          dart pub global activate fastforge 0.6.12
          fastforge package --platform windows --targets exe --artifact-name 'StashFlow-{{build_name}}{{#has_build_number}}+{{build_number}}{{/has_build_number}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
          Get-ChildItem dist -Recurse -Filter *.exe | Rename-Item -NewName "StashFlow-$env:STASHFLOW_VERSION-windows-x64.exe"

      - name: Upload dist packages
        if: matrix.target == 'linux' || matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: StashFlow${{ inputs.archive_suffix }}-${{ matrix.artifact_name }}-dist
          path: dist/**/StashFlow-*

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: StashFlow${{ inputs.archive_suffix }}-${{ matrix.artifact_name }}
          path: |
            build/app/outputs/flutter-apk/StashFlow-*.apk
            StashFlow-*.zip

  release:
    needs: build
    if: inputs.rolling_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get short SHA
        if: inputs.rolling_tag != ''
        id: slug
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for tag update
        if: inputs.rolling_tag != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Update rolling tag
        if: inputs.rolling_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ inputs.rolling_tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ inputs.rolling_tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: inputs.rolling_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Rolling Release
        if: inputs.rolling_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.rolling_tag }}
          name: ${{ inputs.release_name }} (${{ steps.slug.outputs.sha_short }})
          body: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
